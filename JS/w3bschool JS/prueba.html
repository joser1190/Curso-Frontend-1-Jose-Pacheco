<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src= '../on2.png'">Turn on the light</button>

<img id="myImage" src="../off.png" style="width:100px">

<button onclick="document.getElementById('myImage').src='../off.png'">Turn off the light</button>

<h2>What Can JavaScript Do?</h2>

<p id="demo1">JavaScript can change the style of an HTML element.</p>

<button type="button" onclick="document.getElementById('demo1').style.fontSize='35px'">Click Me!</button>
<button type="button" onclick="document.getElementById('demo1').style.fontSize='16px'">Click Me!</button>

<p id="demo2">JavaScript can hide HTML elements.</p>

<button type="button" onclick="document.getElementById('demo2').style.display='none'">Click Me!</button><button type="button" onclick="document.getElementById('demo2').style.display='block'">Click Me!</button>


</body>
</html>
